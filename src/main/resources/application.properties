# Spring Application Name
spring.application.name=AquaMonitor Platform

# API port
server.port=8080

# Spring DataSource Configuration (MySQL, schema: aquamonitor)
spring.datasource.url=jdbc:mysql://localhost:3306/aquamonitor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345Mysql$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.aquamonitor.platform.u20241e281.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Jackson: reject attributes that are not part of the contract (id, createdAt, updatedAt, ...)
# and decimal numbers for integer attributes
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Application Information for Documentation (taken from pom.xml)
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# i18n message bundles (English by default, Spanish for es / es-PE)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
