# Spring Application Name
spring.application.name=Daimler Truck Platform

# API port
server.port=8080

# Spring DataSource Configuration (MySQL, schema: daimlertruck)
spring.datasource.url=jdbc:mysql://localhost:3306/daimlertruck?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.daimlertruck.platform.u20241e281.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation (taken from pom.xml)
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
